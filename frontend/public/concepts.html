<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reAFresh concepts</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <style>
      :root {
        --ground: #f2f1ee;
        --ink: #1b1b1d;
        --muted: #5d5c58;
        --line: #d8d6d0;
        --panel: #ffffff;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 14px 24px;
        background: rgba(242, 241, 238, 0.94);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-left: auto;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      select,
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 36px;
        padding: 0 12px;
      }
      button[aria-pressed='true'] {
        background: var(--ink);
        color: #ffffff;
        border-color: var(--ink);
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr));
        gap: 24px;
        padding: 24px;
      }
      main.is-mobile {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      article {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .meta {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .meta h2 {
        margin: 0;
        font-size: 15px;
      }
      .meta p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        flex: 1;
      }
      .meta a {
        color: var(--ink);
        font-size: 13px;
        white-space: nowrap;
        text-underline-offset: 3px;
      }
      .viewport {
        position: relative;
        overflow: hidden;
      }
      .viewport iframe {
        position: absolute;
        top: 0;
        left: 0;
        border: 0;
        transform-origin: 0 0;
        background: #ffffff;
      }
      .note {
        margin: 0;
        padding: 0 24px 24px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>reAFresh redesign concepts</h1>
      <div class="controls">
        <label
          >Program
          <select id="route">
            <option value="dashboard">Dashboard</option>
            <option value="checklists">Checklists</option>
            <option value="calendar">Calendar</option>
            <option value="habits">Habits</option>
            <option value="tasks">Task Tracker</option>
            <option value="audio">Audio Converter</option>
            <option value="ai">AI</option>
            <option value="qr">QR Generator</option>
          </select>
        </label>
        <button type="button" id="desktop" aria-pressed="true">Desktop</button>
        <button type="button" id="mobile" aria-pressed="false">Phone</button>
      </div>
    </header>
    <main id="grid"></main>
    <p class="note">Sign in once in a normal tab first; every frame shares that session. Each concept also opens on its own with ?concept=&lt;name&gt; on any page, and ?concept=off returns to the current design.</p>
    <script>
      const entries = [
        { id: 'off', name: 'Current', line: 'The design as it ships today, for reference.' },
        { id: 'console', name: 'Console', line: 'A well-made desk appliance: warm grey, tactile keys, one orange key, a green lamp.' },
        { id: 'concourse', name: 'Concourse', line: 'A departure board: steel frame, flap numerals, condensed caps, amber lamps.' },
        { id: 'coupon', name: 'Coupon', line: 'A ticket wallet: navy spine, perforated coupons, red stamp, carbon figures.' },
        { id: 'dawn', name: 'Dawn', line: 'A stage at dawn: soft dark, a cobalt and rose horizon that follows the hour.' },
        { id: 'manual', name: 'Manual', line: 'A tabbed manual: every program its own colour, pages as leaves, stepped motion.' },
        { id: 'sheet', name: 'Sheet', line: 'An answer sheet: dropout-green fields, timing marks, bubbles filled in pencil.' },
      ];
      const sizes = { desktop: { w: 1440, h: 900 }, mobile: { w: 390, h: 844 } };
      let mode = 'desktop';
      const grid = document.getElementById('grid');
      const route = document.getElementById('route');

      function frameUrl(entry) {
        return `/${route.value}?concept=${entry.id}`;
      }

      function fit(article) {
        const box = article.querySelector('.viewport');
        const frame = box.querySelector('iframe');
        const size = sizes[mode];
        const scale = box.clientWidth / size.w;
        frame.style.width = `${size.w}px`;
        frame.style.height = `${size.h}px`;
        frame.style.transform = `scale(${scale})`;
        box.style.height = `${size.h * scale}px`;
      }

      function render() {
        grid.className = mode === 'mobile' ? 'is-mobile' : '';
        grid.replaceChildren();
        for (const entry of entries) {
          const article = document.createElement('article');
          article.innerHTML = `
            <div class="meta"><h2></h2><p></p><a target="_blank" rel="noopener">Open</a></div>
            <div class="viewport"><iframe loading="lazy"></iframe></div>`;
          article.querySelector('h2').textContent = entry.name;
          article.querySelector('p').textContent = entry.line;
          article.querySelector('a').href = frameUrl(entry);
          const frame = article.querySelector('iframe');
          frame.title = `${entry.name} concept`;
          frame.src = frameUrl(entry);
          grid.appendChild(article);
          new ResizeObserver(() => fit(article)).observe(article);
          fit(article);
        }
      }

      route.addEventListener('change', render);
      for (const id of ['desktop', 'mobile']) {
        document.getElementById(id).addEventListener('click', () => {
          mode = id;
          document.getElementById('desktop').setAttribute('aria-pressed', String(id === 'desktop'));
          document.getElementById('mobile').setAttribute('aria-pressed', String(id === 'mobile'));
          render();
        });
      }
      render();
    </script>
  </body>
</html>
