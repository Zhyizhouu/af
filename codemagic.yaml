workflows:
  ios-workflow:
    name: AF iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        script: flutter pub run flutter_launcher_icons
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Flutter build ipa (no signing)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
    publishing:
      email:
        recipients:
          - itzalfree07@gmail.com
        notify:
          success: true
          failure: true